<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Arvelo · Müügiarved — tihe vaade</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#f6f4ee;--surface:#fff;--surface-2:#f0ede5;--border:#e6e1d4;--border-strong:#d4cebe;--text:#0a0a0a;--text-2:#4a4946;--text-3:#8e8c84;--accent:#ff4e2c;--accent-soft:#ffe7df;--accent-soft-2:#fff3ee;--pos:#0e7b5a;--pos-soft:#e2efe9;--warn:#b07d1f;--warn-soft:#f5ecd6;--neg:#c0392b;--neg-soft:#fbeaea;--row-alt:#faf8f3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg)}
body{overflow-x:auto}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;overflow:hidden;font-size:13px}
.mono{font-family:'Inter',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;letter-spacing:-0.005em}
a{color:var(--accent);text-decoration:none}a:hover{color:#d93c1d;text-decoration:underline}
button{font-family:inherit;font-size:inherit;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#dcd6c8;border-radius:99px;border:2.5px solid var(--bg)}
kbd{font-family:'Inter',system-ui,sans-serif;font-size:10px;padding:1px 4px;border:1px solid var(--border-strong);border-radius:4px;color:var(--text-3);background:var(--surface-2)}
svg.i{width:1em;height:1em;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke:currentColor;flex-shrink:0}
.shell{height:100vh;min-width:1240px;padding:12px 16px;display:flex;flex-direction:column;gap:9px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.btn{display:inline-flex;align-items:center;gap:6px;height:29px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:#e8431f}
.btn.sm{height:25px;padding:0 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
/* ── rida 1 ── */
.topbar{display:flex;align-items:center;gap:10px;flex-shrink:0;height:29px}
.topbar h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-0.03em}
.topbar .sub{font-size:12px;color:var(--text-3)}
.topbar .acts{margin-left:14px;display:flex;gap:7px;flex-shrink:0}
.topbar .metrics{margin-left:auto}
/* ── rida 2: tabid + periood + otsing + mõõdikud ── */
.railrow{display:flex;align-items:center;gap:10px;flex-shrink:0;height:36px}
.tabs{display:inline-flex;gap:3px;padding:3px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px}
.tab{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;height:26px;padding:0 10px;border:none;border-radius:7px;background:transparent;color:var(--text-2);font-weight:600;font-size:12.5px}
.tab.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.07)}
.tab .pill{font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:99px;background:var(--border);color:var(--text-2)}
.tab.on .pill{background:var(--accent);color:#fff}
.metrics{display:flex;align-items:center;margin-left:auto;flex-shrink:0}
.metric{display:flex;align-items:baseline;gap:6px;padding:0 12px;border-left:1px solid var(--border);white-space:nowrap}
.metric:first-child{border-left:none}
.metric .k{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3)}
.metric .v{font-size:14.5px;font-weight:700;letter-spacing:-0.03em}
.metric.neg .v{color:var(--neg)}
.search{position:relative;flex:0 0 190px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:13px}
.search input{height:29px;width:100%;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-family:inherit;font-size:12.5px;color:var(--text);padding:0 9px 0 27px}
.search input:focus{outline:none;border-color:var(--accent)}
/* periood */
.per{position:relative;flex-shrink:0}
.perbtn{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex-shrink:0;height:29px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-weight:500}
.perbtn.on{border-color:var(--accent);background:var(--accent-soft-2);color:#b8330f;font-weight:600}
.perpop{position:absolute;top:34px;left:0;z-index:30;width:294px;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:0 10px 28px rgba(0,0,0,.13)}
.perpop[hidden]{display:none}
.lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);margin-bottom:6px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.presets button{height:27px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text-2);font-size:12px;text-align:left;padding:0 8px}
.presets button:hover{background:var(--surface-2)}
.presets button.on{border-color:var(--accent);background:var(--accent-soft-2);color:#b8330f;font-weight:600}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.dates input{height:29px;width:100%;border:1px solid var(--border);border-radius:7px;background:var(--surface);font-family:'Inter',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:12px;color:var(--text);padding:0 8px}
.dates input:focus{outline:none;border-color:var(--accent)}
.perfoot{display:flex;gap:6px;align-items:center;margin-top:10px}
.perfoot .hint{font-size:11px;color:var(--text-3);margin-right:auto}
/* ── keha ── */
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(370px,0.48fr);gap:9px}
.body.wide{grid-template-columns:minmax(0,1fr)}
.body.wide>.col:first-child{display:none}
.body[hidden],#full[hidden]{display:none}
#full{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.fsplit{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px}
.fsplit>.fleft{display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.fsplit>.fright{border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow-y:auto;background:var(--row-alt)}
.bigh,.bigr{display:grid;grid-template-columns:minmax(0,1fr) 54px 74px 62px 52px 82px 82px;gap:10px;padding:7px 14px;align-items:baseline;font-size:12.5px}
.bigh{background:var(--surface-2);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);border-bottom:1px solid var(--border);position:sticky;top:0}
.bigr{border-bottom:1px solid #f1eee7}
.bigr:nth-child(even){background:var(--row-alt)}
.bigr .t{font-weight:500}
.dhead>div:first-child{min-width:0}
.bigtot{display:flex;justify-content:flex-end;gap:20px;white-space:nowrap;padding:9px 14px;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--text-2)}
.bigtot b{font-weight:700;color:var(--text)}
.jl{display:grid;grid-template-columns:64px minmax(0,1fr) 90px 90px;gap:10px;padding:4px 14px;font-size:12px;align-items:baseline;border-top:1px dashed #ece8dd}
.crumb{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3)}
.tscroll{flex:1;min-height:0;display:flex;flex-direction:column;overflow-x:auto}
.tscroll>*{min-width:fit-content}
.col{display:flex;flex-direction:column;min-height:0;overflow:hidden}
/* ── tabel ── */
.thead,.trow{display:grid;grid-template-columns:var(--cols);align-items:center}
.thead{height:32px;background:var(--surface-2);border-bottom:1px solid var(--border);border-radius:11px 11px 0 0;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);flex-shrink:0;user-select:none}
.th{position:relative;padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.th.r{justify-content:flex-end}
.th .grip{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:2}
.th .grip:after{content:'';position:absolute;left:3px;top:6px;bottom:6px;width:1px;background:var(--border-strong);opacity:0;transition:opacity .12s}
.th .grip:hover:after,body.resizing .th .grip:after{opacity:1;background:var(--accent)}
.th .sort{opacity:0;font-size:11px}
.th.sorted{color:var(--text-2)}
.th.sorted .sort{opacity:1;color:var(--accent)}
.rows{flex:1;min-height:0;overflow-y:auto;overflow-x:visible}
.trow{padding:6px 0;border-bottom:1px solid #f1eee7;cursor:pointer;background:var(--surface);font-size:12.5px}
.trow:nth-child(even){background:var(--row-alt)}
.trow:hover{background:var(--accent-soft-2)}
.trow.on{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.trow>div{padding:0 8px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.trow .idx{color:#c3bfb2;font-size:10.5px;text-align:right;padding-right:6px}
.trow .nr{color:var(--accent);font-weight:500;font-size:12px}
.cust{display:flex;align-items:center;gap:7px;min-width:0}
.av{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:8.5px;font-weight:700;flex-shrink:0}
.cust .nm{min-width:0}
.cust .n1{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
.cust .n2{display:block;font-size:10.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{text-align:right;font-weight:600;font-size:12.5px}
.num.mut{font-weight:500;color:var(--text-3)}
.dt{color:var(--text-2);font-size:11.5px}
.dt .d2{font-size:10px;color:var(--text-3)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:5px;white-space:nowrap}
.tag .dot{width:5px;height:5px;border-radius:99px;background:currentColor}
.tag.draft{background:var(--surface-2);color:var(--text-3)}
.tag.sent{background:#eaf0ff;color:#2c5cf6}
.tag.paid{background:var(--pos-soft);color:var(--pos)}
.tag.over{background:var(--neg-soft);color:var(--neg)}
.tag.void{background:var(--surface-2);color:var(--text-3);text-decoration:line-through}
.tag .n{font-weight:700;opacity:.75}
.listhead{display:flex;align-items:center;gap:8px;height:33px;white-space:nowrap;padding:0 10px;border-bottom:1px solid var(--border);background:var(--surface);border-radius:11px 11px 0 0;flex-shrink:0;font-size:11.5px;color:var(--text-2)}
.listhead b{font-weight:600;color:var(--text)}
.listhead .r{margin-left:auto;display:flex;align-items:center;gap:7px}
.warnstrip{display:flex;align-items:center;gap:7px;padding:0 10px;height:31px;background:var(--warn-soft);border-bottom:1px solid #e8dcbc;color:#7d5a13;font-size:11.5px;flex-shrink:0;white-space:nowrap;overflow:hidden}
.warnstrip .btn{margin-left:auto}
.tfoot{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-top:1px solid var(--border);flex-shrink:0;font-size:11.5px;color:var(--text-3)}
.tfoot .r{margin-left:auto;display:flex;align-items:center;gap:8px}
/* ── detail ── */
.dhead{display:flex;flex-direction:column;align-items:stretch;gap:7px;padding:10px 13px;border-bottom:1px solid var(--border);background:var(--surface-2);border-radius:11px 11px 0 0;flex-shrink:0}
.dhead h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-0.025em}
.dhead .line{margin-top:2px;font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dhead .nav{margin-left:0;display:flex;gap:4px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.dbody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.sec.grow{flex:1 1 auto;min-height:132px;display:flex;flex-direction:column}
.sec.grow .lines{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.sec.grow .lscroll{flex:1;min-height:0;overflow-y:auto}
.dsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--border)}
.dsplit>.sec{border-bottom:none;border-left:1px solid var(--border)}
.dsplit>.sec:first-child{border-left:none}
.bar{height:4px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--pos)}
.sums{display:grid;grid-template-columns:minmax(0,1.15fr) repeat(3,minmax(0,1fr));border-bottom:1px solid var(--border);flex-shrink:0}
.sums>div{padding:9px 12px;border-left:1px solid var(--border)}
.sums>div:first-child{border-left:none}
.sums .k{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3)}
.sums .v{font-size:18px;font-weight:700;letter-spacing:-0.035em;margin-top:2px}
.sums .s{font-size:15px;font-weight:600;letter-spacing:-0.03em;margin-top:3px}
.sums .h{font-size:10.5px;color:var(--text-3);margin-top:1px}
.sec{padding:10px 13px;border-bottom:1px solid var(--border)}
.sech{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--text-3);margin-bottom:8px}
.sech .r{margin-left:auto;white-space:nowrap;flex-shrink:0;padding-left:10px;text-transform:none;letter-spacing:0;font-weight:500;font-size:11px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.f{border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:var(--row-alt);min-width:0}
.f .k{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3)}
.f .v{font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.lines{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.lhead,.lrow{display:grid;grid-template-columns:minmax(0,1fr) 40px 62px 34px 74px;gap:6px;padding:5px 9px;align-items:baseline;font-size:11.5px}
.lhead{background:var(--surface-2);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);border-bottom:1px solid var(--border)}
.lrow{border-top:1px solid #f1eee7}
.lrow:first-of-type{border-top:none}
.lrow .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltot{display:flex;gap:14px;justify-content:flex-end;padding:6px 9px;border-top:1px solid var(--border);background:var(--row-alt);font-size:11.5px;color:var(--text-2)}
.ltot b{font-weight:600;color:var(--text)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;white-space:nowrap;padding:3px 0;font-size:12px;color:var(--text-2);border-top:1px dashed #ece8dd}
.kv>b{text-align:right;overflow:hidden;text-overflow:ellipsis}
.kv:first-of-type{border-top:none}
.kv b{font-weight:600;color:var(--text)}
#detail .tlrow{display:flex;align-items:center;gap:7px;font-size:11px}
#detail .tlrow>span:nth-child(3){flex:1;min-width:0}
#detail .tlrow>span:last-child{display:none}
.tlrow>span:nth-child(3){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl{display:flex;flex-direction:column;gap:0}
.tlrow{display:grid;grid-template-columns:70px 12px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:11.5px;color:var(--text-2);padding:3px 0}
.tlrow .bul{width:7px;height:7px;border-radius:99px;background:var(--border-strong);justify-self:center}
.tlrow.done .bul{background:var(--pos)}
.tlrow .mono{color:var(--text-3)}
.dfoot{display:flex;align-items:center;gap:7px;padding:8px 13px;border-top:1px solid var(--border);background:rgba(255,255,255,.96);flex-shrink:0;flex-wrap:wrap}
.dfoot .r{margin-left:auto;display:flex;gap:7px}
.empty{display:grid;place-items:center;height:100%;color:var(--text-3);font-size:12.5px}
.menu{position:absolute;right:0;top:32px;z-index:30;width:210px;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.13)}
.menu[hidden]{display:none}
.menu label{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:7px;font-size:12px;color:var(--text-2);cursor:pointer}
.menu label:hover{background:var(--surface-2)}
.menu .mfoot{display:flex;padding:5px 7px 2px;border-top:1px solid var(--border);margin-top:4px}
input[type=checkbox]{width:13px;height:13px;accent-color:var(--accent);margin:0;cursor:pointer}
body.resizing{cursor:col-resize;user-select:none}
@media (max-width:1420px){.metrics .metric:last-child{display:none}}
@media (max-width:1300px){.tab .pill{display:none}}
@media (max-width:700px){.body{grid-template-columns:minmax(0,1fr)}.metrics .metric:nth-child(n+3){display:none}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <h1>Müügiarved</h1>
    <span class="sub" id="subline"></span>
    <div class="metrics" id="metrics"></div>
    <div class="acts">
      <button class="btn primary"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Uus arve <kbd style="border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.18);color:#fff">U</kbd></button>
      <button class="btn">Uus kreeditarve</button>
      <button class="btn ghost"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg> Värskenda</button>
    </div>
  </div>

  <div class="railrow">
    <div class="tabs" id="tabs"></div>
    <div class="per">
      <button class="perbtn" id="perbtn"><svg class="i" viewBox="0 0 24 24"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg> <span id="perlbl">Viimased 90 päeva</span> <svg class="i" viewBox="0 0 24 24" style="font-size:11px"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="perpop" id="perpop" hidden>
        <div class="lbl">Arve kuupäev</div>
        <div class="presets" id="presets"></div>
        <div class="lbl" style="margin:10px 0 6px">Kohandatud vahemik</div>
        <div class="dates"><input id="d1" placeholder="pp.kk.aaaa" /><input id="d2" placeholder="pp.kk.aaaa" /></div>
        <div class="perfoot"><span class="hint" id="perhint"></span><button class="btn sm" id="perclear">Eemalda</button><button class="btn sm primary" id="perapply">Rakenda</button></div>
      </div>
    </div>
    <div class="search"><svg class="i" viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/></svg><input id="q" placeholder="Otsi arvet või klienti  /" /></div>
  </div>

  <div class="body">
    <div class="col card">
      <div class="listhead">
        <span id="counts"></span>
        <div class="r" style="position:relative">
          <button class="btn sm ghost" id="colbtn"><svg class="i" viewBox="0 0 24 24"><path d="M3 5h18M3 12h18M3 19h18"/></svg> Veerud</button>
          <div class="menu" id="colmenu" hidden></div>
        </div>
      </div>
      <div class="warnstrip" id="warnstrip">
        <svg class="i" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        <span id="warntext"></span>
        <button class="btn sm primary">Kinnita mustandid</button>
      </div>
      <div class="tscroll"><div class="thead" id="thead"></div><div class="rows" id="rows"></div></div>
      <div class="tfoot">
        <span id="footleft"></span>
        <div class="r"><span class="mono" id="footsum"></span><button class="btn sm ghost">Ekspordi CSV</button></div>
      </div>
    </div>
    <div class="col card" id="detail"></div>
  </div>
  <div class="card" id="full" hidden></div>

const ITEMS=['Kuutasu · raamatupidamine','Transporditeenus','Rehvivahetus (4 tk)','Varuosad · komplekt','Hooldustööd','Konsultatsioon (h)','Materjalid','Rendiarve · august','Andmeside','Paigaldustööd'];

const dstr=d=>pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();

let seed=7;const rnd=()=>(seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff;

// ── andmed ─────────────────────────────────────────────────────────────────
const INV=[];
for(let i=0;i<58;i++){
  const nr=25930-i;
  const issued=new Date(TODAY);issued.setDate(TODAY.getDate()-Math.floor(rnd()*300));
  if(i<2)issued.setTime(new Date(2026,8,1).getTime());
  const due=new Date(issued);due.setDate(issued.getDate()+(rnd()<.6?7:14));
  const sub=Math.round((40+rnd()*1400)*100)/100;
  const vat=Math.round(sub*0.24*100)/100;
  const total=Math.round((sub+vat)*100)/100;
  const overdue=Math.round((TODAY-due)/86400000);
  let st;
  if(i<2)st='draft';
  else if(rnd()<.16)st='paid';
  else if(overdue>0)st='overdue';
  else st='sent';
  if(i===9)st='void';
  const paid=st==='paid'?total:(st==='overdue'&&rnd()<.15?Math.round(total*0.4*100)/100:0);
  const n=Math.floor(rnd()*3)+1;const lines=[];
  let rest=sub;
  for(let k=0;k<n;k++){
    const amt=k===n-1?Math.round(rest*100)/100:Math.round(rest/(n-k)*rnd()*100)/100||Math.round(rest/n*100)/100;
    rest=Math.round((rest-amt)*100)/100;
    const qty=Math.max(1,Math.round(rnd()*4));
    lines.push({t:ITEMS[Math.floor(rnd()*ITEMS.length)],qty,price:Math.round(amt/qty*100)/100,vat:24,amt});
  }
  INV.push({nr,name:NAMES[Math.floor(rnd()*NAMES.length)],reg:'1'+String(Math.floor(rnd()*8999999)+1000000),issued,due,sub,vat,total,paid,st,overdue,lines,
    ref:String(nr)+'00'+(2500+i),journal:st==='draft'?null:'PR-2026-'+(1400+i),email:'arved@'+String(NAMES[0]).toLowerCase().replace(/[^a-z]/g,'')+'.ee',
    terms:(rnd()<.6?7:14),credit:Math.round((500+rnd()*4000)/100)*100,openBal:Math.round((rnd()*6000)*100)/100});
}
INV.forEach(v=>{v.open=Math.round((v.total-v.paid)*100)/100;v.email='arved@'+v.name.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,14)+'.ee'});

const ST={draft:{c:'draft',l:'Mustand'},sent:{c:'sent',l:'Saadetud'},paid:{c:'paid',l:'Makstud'},overdue:{c:'over',l:'Tähtaeg ületatud',s:'Üle tähtaja'},void:{c:'void',l:'Tühistatud'}};

 {id:'idx',l:'',w:30,fix:true,lock:true},

function periodRange(){
  const t=TODAY,y=t.getFullYear(),m=t.getMonth();
  if(S.per==='custom')return [S.d1,S.d2];
  if(S.per==='month')return [new Date(y,m,1),new Date(y,m+1,0)];
  if(S.per==='prev')return [new Date(y,m-1,1),new Date(y,m,0)];
  if(S.per==='q'){const q=Math.floor(m/3)*3;return [new Date(y,q,1),new Date(y,q+3,0)]}
  if(S.per==='90'){const a=new Date(t);a.setDate(t.getDate()-90);return [a,t]}
  if(S.per==='year')return [new Date(y,0,1),new Date(y,11,31)];
  return [null,null];
}
function inPeriod(v){const[a,b]=periodRange();if(a&&v.issued<a)return false;if(b&&v.issued>new Date(b.getFullYear(),b.getMonth(),b.getDate(),23,59))return false;return true}
function tabMatch(v,tab){return tab==='all'?true:tab===v.st}

  const q=S.q.trim().toLowerCase();

}

function renderTabs(){
  const counts={all:0,draft:0,sent:0,paid:0,overdue:0,void:0};

  const c=cols().map(c=>{

        <div class="tl">
          <div class="tlrow done"><span class="mono">${dstr(v.issued)}</span><span class="bul"></span><span>Arve koostatud</span><span class="mono">Peeter</span></div>
          ${v.st!=='draft'?`<div class="tlrow done"><span class="mono">${dstr(v.issued)}</span><span class="bul"></span><span>Saadetud e-arvena</span><span class="mono">auto</span></div>`:''}
          ${v.paid>0?`<div class="tlrow done"><span class="mono">${dstr(v.due)}</span><span class="bul"></span><span>Laekumine ${fmt(v.paid)}</span><span class="mono">pank</span></div>`:''}
          ${v.st==='overdue'?`<div class="tlrow"><span class="mono">${dstr(v.due)}</span><span class="bul"></span><span>Meeldetuletus saatmata</span><span class="mono">—</span></div>`:''}
          ${v.st==='draft'?`<div class="tlrow"><span class="mono">—</span><span class="bul"></span><span>Ootab kinnitamist</span><span class="mono">—</span></div>`:''}
        </div>
      </div>
      <div class="sec" style="border-bottom:none">
        <div class="sech">Manused</div>
        <div class="kv"><span>arve_${v.nr}.pdf</span><b><a href="#">Ava</a></b></div>
        <div class="kv"><span>e-arve XML</span><b><a href="#">Ava</a></b></div>
      </div>
    </div>
  </div>
  <div class="dfoot">
    <button class="btn primary">${v.st==='draft'?'Kinnita ja saada':'Saada uuesti'}</button>
    <button class="btn">Muuda</button>
    <button class="btn">Registreeri laekumine</button>
    <div class="r"><button class="btn ghost">Kreediteeri</button><button class="btn ghost">Prindi</button><button class="btn ghost">···</button></div>
  </div>`;
}
function openFull(){S.mode='open';renderFull()}
function closeFull(){S.mode='list';renderFull()}
function renderColMenu(){
  document.getElementById('colmenu').innerHTML=COLS.filter(c=>!c.lock).map(c=>
    `<label><input type="checkbox" data-hide="${c.id}" ${S.hidden.has(c.id)?'':'checked'} /> ${c.l}</label>`).join('')
    +`<div class="mfoot"><button class="btn sm ghost" id="colreset">Lähtesta laiused</button></div>`;
}
function renderPeriod(){
  document.getElementById('presets').innerHTML=PRESETS.map(([k,l])=>`<button data-pre="${k}" class="${S.per===k?'on':''}">${l}</button>`).join('');
  document.getElementById('perlbl').textContent=S.per==='custom'?(dstr(S.d1)+' – '+dstr(S.d2)):PRESETS.find(p=>p[0]===S.per)[1];
  document.getElementById('perbtn').classList.toggle('on',S.per!=='90');
  const[a,b]=periodRange();
  document.getElementById('perhint').textContent=a?dstr(a)+' – '+dstr(b):'piiranguta';
}
function renderAll(){renderTabs();renderMetrics();renderTable();renderDetail();renderPeriod();renderFull()}
renderColMenu();renderAll();

// ── interaktsioonid ────────────────────────────────────────────────────────
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;S.tab=b.dataset.tab;renderAll()};
document.getElementById('q').oninput=e=>{S.q=e.target.value;renderTable();renderDetail()};
document.getElementById('rows').onclick=e=>{const r=e.target.closest('[data-nr]');if(!r)return;S.sel=+r.dataset.nr;renderTable();renderDetail()};
document.getElementById('rows').ondblclick=e=>{const r=e.target.closest('[data-nr]');if(!r)return;S.sel=+r.dataset.nr;renderTable();renderDetail();openFull()};
document.getElementById('thead').onclick=e=>{
  if(e.target.dataset.grip)return;
  const th=e.target.closest('[data-col]');if(!th||th.dataset.col==='idx')return;
  if(S.sort===th.dataset.col)S.dir*=-1;else{S.sort=th.dataset.col;S.dir=1}
  renderTable()};
document.getElementById('detail').addEventListener('click',e=>{
  if(e.target.closest('[data-open]')){openFull();return}
  if(e.target.closest('[data-wide]')){S.wide=!S.wide;document.querySelector('.body').classList.toggle('wide',S.wide);renderDetail();return}
  const b=e.target.closest('[data-nav]');if(!b)return;
  const list=visible();const i=list.findIndex(x=>x.nr===S.sel)+ +b.dataset.nav;
  if(list[i]){S.sel=list[i].nr;renderTable();renderDetail()}});
document.getElementById('full').addEventListener('click',e=>{
  if(e.target.closest('[data-back]')){closeFull();return}
  const b=e.target.closest('[data-nav]');if(!b)return;
  const list=visible();const i=list.findIndex(x=>x.nr===S.sel)+ +b.dataset.nav;
  if(list[i]){S.sel=list[i].nr;renderTable();renderDetail();renderFull()}});

// veeru laiuse lohistamine
let drag=null;
document.getElementById('thead').addEventListener('mousedown',e=>{
  const g=e.target.dataset&&e.target.dataset.grip;if(!g)return;
  e.preventDefault();
  const th=e.target.parentElement;
  drag={id:g,x:e.clientX,w:th.getBoundingClientRect().width};
  document.body.classList.add('resizing')});
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  S.widths[drag.id]=Math.max(56,Math.round(drag.w+(e.clientX-drag.x)));
  document.documentElement.style.setProperty('--cols',colTemplate())});
window.addEventListener('mouseup',()=>{
  if(!drag)return;drag=null;document.body.classList.remove('resizing');
  localStorage.setItem('arvelo.inv.cols',JSON.stringify(S.widths))});
document.getElementById('thead').addEventListener('dblclick',e=>{
  const g=e.target.dataset&&e.target.dataset.grip;if(!g)return;
  delete S.widths[g];localStorage.setItem('arvelo.inv.cols',JSON.stringify(S.widths));renderTable()});

// veergude menüü
const colmenu=document.getElementById('colmenu');
document.getElementById('colbtn').onclick=e=>{e.stopPropagation();colmenu.hidden=!colmenu.hidden};
colmenu.onclick=e=>{
  e.stopPropagation();
  if(e.target.id==='colreset'){S.widths={};localStorage.removeItem('arvelo.inv.cols');renderTable();return}
  const id=e.target.dataset&&e.target.dataset.hide;if(!id)return;
  if(e.target.checked)S.hidden.delete(id);else S.hidden.add(id);
  localStorage.setItem('arvelo.inv.hidden',JSON.stringify([...S.hidden]));renderTable()};

// periood
const perpop=document.getElementById('perpop');
document.getElementById('perbtn').onclick=e=>{e.stopPropagation();perpop.hidden=!perpop.hidden;if(!perpop.hidden){const[a,b]=periodRange();document.getElementById('d1').value=a?dstr(a):'';document.getElementById('d2').value=b?dstr(b):''}};
perpop.onclick=e=>{
  e.stopPropagation();
  const p=e.target.dataset&&e.target.dataset.pre;
  if(p){S.per=p;renderAll();perpop.hidden=true}};
document.getElementById('perapply').onclick=e=>{
  e.stopPropagation();
  const p=s=>{const m=s.trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);return m?new Date(+m[3],+m[2]-1,+m[1]):null};
  const a=p(document.getElementById('d1').value),b=p(document.getElementById('d2').value);
  if(a&&b){S.per='custom';S.d1=a;S.d2=b;renderAll();perpop.hidden=true}};
document.getElementById('perclear').onclick=e=>{e.stopPropagation();S.per='all';renderAll();perpop.hidden=true};
document.addEventListener('click',()=>{perpop.hidden=true;colmenu.hidden=true});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.mode==='open'){closeFull();return}
  if(e.key==='/'&&document.activeElement.id!=='q'){e.preventDefault();document.getElementById('q').focus();return}
  if(document.activeElement.tagName==='INPUT')return;
  if(e.key==='Enter'){e.preventDefault();S.mode==='open'?closeFull():openFull();return}
  if(e.key==='j'||e.key==='k'){
    const list=visible();const i=list.findIndex(x=>x.nr===S.sel)+(e.key==='j'?1:-1);
    if(list[i]){S.sel=list[i].nr;renderTable();renderDetail();if(S.mode==='open')renderFull();
      const el=document.querySelector('.trow.on');if(el){const r=el.getBoundingClientRect(),p=el.parentElement.getBoundingClientRect();if(r.bottom>p.bottom||r.top<p.top)el.parentElement.scrollTop+=r.top-p.top-(p.height/2)}}}});
</script>
</body>
</html>
