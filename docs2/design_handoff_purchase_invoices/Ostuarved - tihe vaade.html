<script>
const SUP=[['Elektrilevi OÜ','11050857','EE422200221011131489','4060'],['Telia Eesti AS','10234957','EE551010220016645011','4020'],['Circle K Eesti AS','10036451','EE301010022002456014','4040'],['Bolt Operations OÜ','14532901','EE127700771003812345','4030'],['Office Day OÜ','10712838','EE602200221034512278','4010'],['Würth OÜ','10020496','EE391010220023578018','4070'],['Tele2 Eesti AS','10069046','EE251010220026012018','4020'],['Neste Eesti AS','10015853','EE672200221020011112','4040'],['Ramirent Baltic AS','10011981','EE151010220034572014','4050'],['Kinnisvarahaldus Kesklinn OÜ','12488390','EE877700771001234567','4050'],['DPD Eesti AS','10332021','EE421010220005678019','4030'],['Tallinna Vesi AS','10257326','EE702200221012345678','4060'],['Zone Media OÜ','10815387','EE331010220041237012','4020'],['Rehvid Pluss OÜ','11215873','EE482200221055512341','4070'],['Swedbank AS','10060701','EE382200221020145685','4080'],['Microsoft Ireland Operations Ltd','IE8256796U','IE29AIBK93115212345678','4020']];

 {id:'ck',l:'',w:30,lock:true},

function inPeriod(v){const[a,b]=periodRange();if(a&&v.issued<a&&!(v.open>0&&isOpenSt(v)))return false;if(b&&v.issued>new Date(b.getFullYear(),b.getMonth(),b.getDate(),23,59))return false;return true}

function act(a,v){
  if(a==='approve'){v.st=v.late>0?'over':'ok';v.journal='OA-2026-'+(700+v.nr%100);toast('Arve '+v.nr+' kinnitatud · kanne '+v.journal)}

  else if(a==='remind'){v.rem.push(new Date(TODAY));v.remNext=new Date(TODAY.getTime()+86400000*3);toast('Meeldetuletus saadetud · '+v.remTo)}
  else if(a==='upload')return toast('Vali PDF või pilt — seome selle mustandiga '+v.nr);
  else if(a==='nodoc'){v.remNext=null;toast('Meeldetuletused peatatud · kanne tehakse ilma originaalita')}
  else if(a==='pay1')return openPay([v.nr]);
  else if(a==='reg')return toast('Tasumise registreerimine — vali pangatehing või sisesta käsitsi');
  else if(a==='edit')return toast('Avaneb ostuarve muutmine');
  else if(a==='open')return openFull();
  else if(a==='batch')return toast('Ava maksepakk '+v.batch);
  refresh();
}

$('thead').addEventListener('mousedown',e=>{const g=e.target.dataset&&e.target.dataset.grip;if(!g)return;e.preventDefault();drag={id:g,x:e.clientX,w:e.target.parentElement.getBoundingClientRect().width};document.body.classList.add('resizing')});
addEventListener('mousemove',e=>{if(!drag)return;S.widths[drag.id]=Math.max(56,Math.round(drag.w+(e.clientX-drag.x)));document.documentElement.style.setProperty('--cols',colTemplate())});
addEventListener('mouseup',()=>{if(!drag)return;drag=null;document.body.classList.remove('resizing');localStorage.setItem('arvelo.pinv.cols',JSON.stringify(S.widths))});
$('thead').addEventListener('dblclick',e=>{const g=e.target.dataset&&e.target.dataset.grip;if(!g)return;delete S.widths[g];localStorage.setItem('arvelo.pinv.cols',JSON.stringify(S.widths));renderTable()});

const perpop=$('perpop');
$('perbtn').onclick=e=>{e.stopPropagation();perpop.hidden=!perpop.hidden;if(!perpop.hidden){const[a,b]=periodRange();$('d1').value=a?dstr(a):'';$('d2').value=b?dstr(b):''}};
perpop.onclick=e=>{e.stopPropagation();const p=e.target.dataset&&e.target.dataset.pre;if(p){S.per=p;renderAll();perpop.hidden=true}};
$('perapply').onclick=e=>{e.stopPropagation();const p=s=>{const m=s.trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);return m?new Date(+m[3],+m[2]-1,+m[1]):null};const a=p($('d1').value),b=p($('d2').value);if(a&&b){S.per='custom';S.d1=a;S.d2=b;renderAll();perpop.hidden=true}};
$('perclear').onclick=e=>{e.stopPropagation();S.per='all';renderAll();perpop.hidden=true};
const tog=(btn,menu)=>{$(btn).onclick=e=>{e.stopPropagation();const m=$(menu),h=m.hidden;closeMenus();m.hidden=!h}};
tog('vatbtn','vatmenu');tog('srcbtn','srcmenu');tog('expmore','expmenu');tog('upbtn','upmenu');
$('vatmenu').onclick=e=>{e.stopPropagation();const b=e.target.closest('[data-vatc]');if(!b)return;S.vatc=b.dataset.vatc;$('vatmenu').hidden=true;renderAll()};
$('srcmenu').onclick=e=>{e.stopPropagation();const b=e.target.closest('[data-src]');if(!b)return;S.src=b.dataset.src;$('srcmenu').hidden=true;renderAll()};
$('upmenu').onclick=e=>{e.stopPropagation();const b=e.target.closest('[data-up]');if(!b)return;$('upmenu').hidden=true;toast({pdf:'Vali PDF või pilt — tuvastame andmed ja loome mustandi',xml:'Vali e-arve XML',csv:'Vali CSV fail — iga rida saab eraldi mustandiks'}[b.dataset.up])};
$('newbtn').onclick=()=>toast('Avaneb uus ostuarve');
function closeMenus(){['perpop','vatmenu','srcmenu','expmenu','upmenu','moremenu','colmenu'].forEach(id=>{const m=$(id);if(m)m.hidden=true})}
document.addEventListener('click',closeMenus);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('modal').hidden){closeModal();return}if(S.mode==='open'){closeFull();return}if(S.chk.size){S.chk.clear();refresh();return}}
  if(e.key==='/'&&document.activeElement.id!=='q'){e.preventDefault();$('q').focus();return}
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)||!$('modal').hidden)return;
  if(e.key==='Enter'){e.preventDefault();S.mode==='open'?closeFull():openFull();return}
  if(e.key==='x'){S.chk.has(S.sel)?S.chk.delete(S.sel):S.chk.add(S.sel);renderTable();return}
  if(S.ptab==='pdf'&&$('pdfbox')&&['+','=','-','0'].includes(e.key)){e.preventDefault();setZoom(e.key==='0'?'fit':e.key==='-'?'-':'+');return}
  if(e.key==='u'||e.key==='U'){$('newbtn').click();return}
  if(e.key==='j'||e.key==='k'){const list=visible(),i=list.findIndex(x=>x.nr===S.sel)+(e.key==='j'?1:-1);
    if(list[i]){S.sel=list[i].nr;renderTable();renderDetail();if(S.mode==='open')renderFull();
      const el=document.querySelector('.trow.on');if(el){const r=el.getBoundingClientRect(),p=el.parentElement.getBoundingClientRect();if(r.bottom>p.bottom||r.top<p.top)el.parentElement.scrollTop+=r.top-p.top-p.height/2}}}});
</script>
</body>
</html>
